# nginx.conf
server {
    listen 80;
    server_name localhost;

    # Sites publicados pelo painel: encaminha /sites/ para o backend, que os
    # serve de uploads/sites/<slug>/. Assim eles abrem sob o domínio principal
    # (studiomythos.com.br/sites/<slug>/) sem depender de roteamento no EasyPanel.
    # O backend é o serviço interno do mesmo projeto EasyPanel, na porta 80.
    location /sites/ {
        proxy_pass http://studiomythos_backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
